name: CodeQL Analysis Advanced
on:
  workflow_dispatch:
  # push:
    # branches: [ develop, main ]
  # pull_request:
    # branches: [ develop, main ]
  # schedule:
    # # Run at 2 AM UTC every Monday
    # - cron: '0 2 * * 1'


jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
          category: github-actions
        - language: csharp
          build-mode: none
          category: csharp-analysis
        - language: javascript-typescript
          build-mode: none
          category: js-ts-analysis
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # Advanced Security Analysis Options
        # security-extended: includes additional security queries beyond the default
        # security-and-quality: includes both security and code quality queries
        # queries: +security-extended
        queries: |
          +security-extended
          +security-and-quality
        
        # Configuration file for advanced options (path filtering, query customization)
        config-file: ./scripts/codeql-config.yml

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: ${{ matrix.category }}
        # Output SARIF to file for filtering before upload
        upload: failure-only
        output: sarif-results
    
    # Filter SARIF results to include only high-priority findings
    # This addresses the "more results per run than allowed (39153 > 25000)" error
    - name: Filter SARIF results
      if: always()
      run: |
        echo "Filtering SARIF results to reduce result count..."
        
        # Install jq if not available
        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          sudo apt-get update && sudo apt-get install -y jq
        fi
        
        # Find and process SARIF files
        for sarif_file in sarif-results/*.sarif; do
          if [ -f "$sarif_file" ]; then
            echo "Processing $sarif_file"
            
            # Create filtered version keeping only error and warning level results
            # Filter out 'note' and 'none' severity findings
            jq '
              .runs[].results |= map(
                select(
                  .level == "error" or 
                  .level == "warning" or
                  (.properties.severity and (.properties.severity == "high" or .properties.severity == "critical"))
                )
              )
            ' "$sarif_file" > "${sarif_file}.filtered"
            
            # Get result counts
            original_count=$(jq '.runs[].results | length' "$sarif_file")
            filtered_count=$(jq '.runs[].results | length' "${sarif_file}.filtered")
            
            echo "Original results: $original_count"
            echo "Filtered results: $filtered_count"
            
            # Replace original with filtered if under limit
            if [ "$filtered_count" -le 25000 ]; then
              mv "${sarif_file}.filtered" "$sarif_file"
              echo "✓ Filtered file is under limit, using filtered results"
            else
              echo "⚠ Warning: Filtered results still exceed 25,000 limit"
              # Additional filtering: keep only errors
              jq '.runs[].results |= map(select(.level == "error"))' "$sarif_file" > "${sarif_file}.filtered2"
              error_count=$(jq '.runs[].results | length' "${sarif_file}.filtered2")
              echo "Error-only count: $error_count"
              
              if [ "$error_count" -le 25000 ]; then
                mv "${sarif_file}.filtered2" "$sarif_file"
                echo "✓ Using error-only results"
              else
                # Last resort: take first 25000 results sorted by severity
                jq '.runs[].results |= (sort_by(.level) | .[:25000])' "$sarif_file" > "${sarif_file}.filtered3"
                mv "${sarif_file}.filtered3" "$sarif_file"
                echo "✓ Truncated to first 25,000 highest priority results"
              fi
              rm -f "${sarif_file}.filtered2"
            fi
            
            rm -f "${sarif_file}.filtered"
          fi
        done
    
    # Upload filtered SARIF results to GitHub Security
    - name: Upload SARIF results
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sarif-results
        category: ${{ matrix.category }}
    
    # Upload results as artifacts for manual review of all findings
    - name: Upload SARIF as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results-${{ matrix.language }}
        path: sarif-results

        retention-days: 30
