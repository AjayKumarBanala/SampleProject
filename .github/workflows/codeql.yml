name: CodeQL Analysis
on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Initialize CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # 3️⃣ Build if manual (optional)
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo "Manual build mode set. Please build your code here."
        exit 1

    # 4️⃣ Perform CodeQL analysis (uploads to Security tab automatically)
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

    # 5️⃣ Find all SARIF files anywhere in the workspace and copy to results folder
    - name: Collect all SARIF files
      run: |
        mkdir -p "$GITHUB_WORKSPACE/results"
        # Find all SARIF files in workspace
        SARIF_FOUND=$(find "$GITHUB_WORKSPACE" -type f -name "*.sarif")
        if [ -z "$SARIF_FOUND" ]; then
          echo "No SARIF files found for ${{ matrix.language }}"
        else
          echo "$SARIF_FOUND" | xargs -I {} cp {} "$GITHUB_WORKSPACE/results/"
          echo "Copied SARIF files to results folder."
        fi

    # 6️⃣ Upload all collected SARIF files as downloadable artifacts
    - name: Upload SARIF artifacts
      if: success() && steps.collect_sarif.outcome != 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif-results-${{ matrix.language }}
        path: ${{ github.workspace }}/results/
