name: CodeQL Advanced

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none       # <-- build mode needed for compiled code
          - language: javascript-typescript
            build-mode: none          # okay for interpreted languages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo "Manual build mode. Please build your code here."
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

    - name: Process SARIF Files
      run: |
        mkdir -p ./results
        # Dynamically find SARIF files under the _work folder
        SARIF_FILE=$(find "$RUNNER_WORKSPACE" -type f -name "${{ matrix.language }}*.sarif" | head -n 1)
        if [[ -f "$SARIF_FILE" ]]; then
          cp "$SARIF_FILE" ./results/
          echo "Copied $(basename $SARIF_FILE) to ./results/"
        else
          echo "No SARIF file found for ${{ matrix.language }}, skipping."
        fi
      env:
        RUNNER_WORKSPACE: ${{ github.workspace }}


    - name: Upload SARIF Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sarif-files-${{ matrix.language }}
        path: ./results/





