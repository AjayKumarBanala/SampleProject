name: CodeQL Analysis + Excel Report

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: msbuild   # needed for compiled languages
          - language: javascript-typescript
            build-mode: none      # okay for interpreted languages

    steps:
    # -------------------- Checkout repo --------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------- Initialize CodeQL --------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # -------------------- Manual build mode placeholder --------------------
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo "Manual build mode. Build your project here."
        exit 1

    # -------------------- Run CodeQL Analysis --------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

    # -------------------- Collect SARIF files --------------------
    - name: Collect SARIF files dynamically
      run: |
        mkdir -p ./results_sarif
        SARIF_FILES=$(find "$GITHUB_WORKSPACE" -type f -name "${{ matrix.language }}*.sarif")
        if [ -z "$SARIF_FILES" ]; then
          echo "No SARIF files found for ${{ matrix.language }}"
        else
          echo "$SARIF_FILES" | xargs -I {} cp {} ./results_sarif/
          echo "Copied SARIF files to ./results_sarif/"
        fi

    # -------------------- Upload SARIF artifacts --------------------
    - name: Upload SARIF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sarif-files-${{ matrix.language }}
        path: ./results_sarif/

    # -------------------- Setup Python --------------------
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python packages
      run: |
        pip install pandas openpyxl

    # -------------------- Convert SARIF to Excel --------------------
    - name: Convert SARIF to Excel
      run: |
        mkdir -p ./results_excel
        for SARIF_FILE in ./results_sarif/*.sarif; do
          if [[ -f "$SARIF_FILE" ]]; then
            python3 - << EOF
import json, pandas as pd, os
sarif_file = "$SARIF_FILE"
base = os.path.basename(sarif_file).replace('.sarif', '')
with open(sarif_file) as f:
    data = json.load(f)
rows = []
for run in data.get("runs", []):
    for result in run.get("results", []):
        ruleId = result.get("ruleId")
        level = result.get("level")
        message = result.get("message", {}).get("text")
        for loc in result.get("locations", []):
            file = loc["physicalLocation"]["artifactLocation"]["uri"]
            line = loc["physicalLocation"]["region"]["startLine"]
            rows.append([file, line, level, ruleId, message])
df = pd.DataFrame(rows, columns=["file", "line", "level", "ruleId", "message"])
df.to_excel(f"./results_excel/{base}.xlsx", index=False)
EOF
          fi
        done

    # -------------------- Upload Excel artifacts --------------------
    - name: Upload Excel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: excel-files-${{ matrix.language }}
        path: ./results_excel/
