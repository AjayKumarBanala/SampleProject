name: CodeQL Analysis + CSV Export

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo "Manual build mode. Please build your code here."
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

    - name: Prepare results folder
      run: mkdir -p ./results

    - name: Process SARIF Files
      run: |
        # Dynamically find SARIF files under the _work folder
        SARIF_FILE=$(find "$RUNNER_WORKSPACE" -type f -name "*.sarif" | head -n 1)
        if [[ -f "$SARIF_FILE" ]]; then
          # Rename to matrix.language.sarif for consistent naming
          cp "$SARIF_FILE" "./results/${{ matrix.language }}.sarif"
          echo "Copied $(basename $SARIF_FILE) as ${{ matrix.language }}.sarif"
        else
          echo "No SARIF file found, skipping."
        fi
      env:
        RUNNER_WORKSPACE: ${{ github.workspace }}

    - name: Upload SARIF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sarif-files-${{ matrix.language }}
        path: ./results/

    # -------------------- Convert SARIF to CSV --------------------
    - name: Convert SARIF to CSV
      uses: mr-sherman/sarif-to-csv@v2.1
      with:
        # Now the filename is consistent
        input-file: "./results/${{ matrix.language }}.sarif"
        output-file: "./results/${{ matrix.language }}.csv"

    - name: Upload CSV artifacts
      uses: actions/upload-artifact@v4
      with:
        name: csv-files-${{ matrix.language }}
        path: ./results/${{ matrix.language }}.csv
