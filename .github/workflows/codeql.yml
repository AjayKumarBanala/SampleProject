name: CodeQL Advanced

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none       # <-- build mode needed for compiled code
          - language: javascript-typescript
            build-mode: none          # okay for interpreted languages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo "Manual build mode. Please build your code here."
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

    # -------- Dynamic SARIF processing --------
    - name: Collect SARIF files
      run: |
        mkdir -p "$GITHUB_WORKSPACE/results"
        # Find any SARIF files in the workspace (generated by CodeQL)
        SARIF_FILES=$(find "$GITHUB_WORKSPACE" -type f -name "*.sarif")
        if [ -z "$SARIF_FILES" ]; then
          echo "No SARIF files found for ${{ matrix.language }}"
        else
          echo "$SARIF_FILES" | xargs -I {} cp {} "$GITHUB_WORKSPACE/results/"
          echo "Copied SARIF files to ./results/"
        fi

    - name: Upload SARIF Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sarif-files-${{ matrix.language }}
        path: ./results/

    - name: Convert SARIF to CSV
      run: |
        mkdir -p "$GITHUB_WORKSPACE/results_csv"
        for f in ./results/*.sarif; do
          base=$(basename "$f" .sarif)
          npx sarif-to-csv "$f" "$GITHUB_WORKSPACE/results_csv/$base.csv"
        done

    - name: Upload CSV Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: csv-files-${{ matrix.language }}
        path: ./results_csv/

