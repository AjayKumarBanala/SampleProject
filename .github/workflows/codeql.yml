name: CodeQL Analysis + CSV Export

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none       # required for compiled languages
          - language: javascript-typescript
            build-mode: none          # okay for interpreted languages

    steps:
    # -------------------- Checkout repository --------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------- Initialize CodeQL --------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # -------------------- Manual build mode placeholder --------------------
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo "Manual build mode. Please build your code here."
        exit 1

    # -------------------- Run CodeQL Analysis --------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

    # -------------------- Prepare folders --------------------
    - name: Prepare folders
      run: |
        mkdir -p ./results_sarif
        mkdir -p ./results_csv

    # -------------------- Collect SARIF files dynamically --------------------
    - name: Collect SARIF files
      run: |
        SARIF_FILES=$(find "$GITHUB_WORKSPACE" -type f -name "${{ matrix.language }}*.sarif")
        if [ -z "$SARIF_FILES" ]; then
          echo "No SARIF files found for ${{ matrix.language }}"
        else
          echo "$SARIF_FILES" | xargs -I {} cp {} ./results_sarif/
          echo "Copied SARIF files to ./results_sarif/"
        fi

    # -------------------- Upload SARIF artifacts --------------------
    - name: Upload SARIF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sarif-files-${{ matrix.language }}
        path: ./results_sarif/

    # -------------------- Convert SARIF to CSV --------------------
    - name: Convert SARIF to CSV
      uses: mr-sherman/sarif-to-csv@v2.1
      with:
        # Dynamically process SARIF files for this language
        input-file: "./results_sarif/${{ matrix.language }}*.sarif"
        output-file: "./results_csv/${{ matrix.language }}.csv"

    # -------------------- Upload CSV artifacts --------------------
    - name: Upload CSV artifacts
      uses: actions/upload-artifact@v4
      with:
        name: csv-files-${{ matrix.language }}
        path: ./results_csv/${{ matrix.language }}.csv
